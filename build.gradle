plugins {
    id 'java-library'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation(
            "com.codeborne:selenide:7.18.2",
            "org.junit.jupiter:junit-jupiter:6.1.3")
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    systemProperty 'baseUrl', System.getProperty('baseUrl', 'https://github.com')
    systemProperty 'browser', System.getProperty('browser', 'chrome')
    systemProperty 'browserSize', System.getProperty('browserSize', '1920x1080')
    systemProperty 'headless', System.getProperty('headless', 'false')
}
