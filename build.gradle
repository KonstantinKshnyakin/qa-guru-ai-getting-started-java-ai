plugins {
    id 'java-library'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

configurations {
    agent {
        canBeResolved = true
        canBeConsumed = true
    }
}

dependencies {
    testImplementation platform("io.qameta.allure:allure-bom:3.0.0")
    testImplementation(
            "com.codeborne:selenide:7.18.2",
            "org.junit.jupiter:junit-jupiter:6.1.3",
            "io.qameta.allure:allure-jupiter",
            "io.qameta.allure:allure-selenide")
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    agent "org.aspectj:aspectjweaver:1.9.25"
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    jvmArgs "-javaagent:${configurations.agent.singleFile}"
    ['baseUrl', 'browser', 'browserSize', 'headless', 'remote', 'browserVersion'].each { name ->
        def value = System.getProperty(name)
        if (value != null) {
            systemProperty name, value
        }
    }
}
